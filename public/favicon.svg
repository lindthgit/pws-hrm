<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d30"/>
      <stop offset="100%" stop-color="#07223b"/>
    </linearGradient>
    <linearGradient id="octo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tentacle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Outer Water Ripple -->
  <circle cx="256" cy="220" r="150" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.25"/>
  
  <!-- Minimal Octopus Head (Smooth Dome) -->
  <path d="M 180,230 C 180,135 332,135 332,230 C 332,260 312,275 256,275 C 200,275 180,260 180,230 Z" fill="url(#octo)"/>
  
  <!-- 8 Minimal Fluid Tentacles -->
  <path d="M 190,255 C 155,275 130,310 145,340 C 155,360 180,350 175,330 C 170,310 190,285 205,268" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 210,265 C 185,295 170,335 190,365 C 202,380 220,370 215,350 C 210,325 225,295 230,270" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 235,270 C 220,305 210,350 230,380 C 240,392 255,385 250,365 C 245,340 250,305 252,270" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 252,270 C 255,310 260,355 270,385 C 275,398 288,395 285,375 C 280,350 272,310 268,270" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 268,270 C 275,305 285,345 305,370 C 318,382 332,372 325,355 C 315,330 295,295 285,268" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 285,268 C 305,290 325,325 345,350 C 358,365 372,355 365,338 C 355,315 330,285 305,265" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 305,265 C 335,280 370,310 360,345 C 352,365 332,360 338,338 C 342,320 325,290 316,260" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 322,245 C 355,255 385,285 380,315 C 375,335 355,332 360,315 C 365,295 340,275 326,252" fill="none" stroke="url(#tentacle)" stroke-width="14" stroke-linecap="round"/>

  <!-- Minimal Cute Modern Eyes -->
  <circle cx="228" cy="215" r="9" fill="#0a1d30"/>
  <circle cx="284" cy="215" r="9" fill="#0a1d30"/>
  <circle cx="231" cy="212" r="3" fill="#ffffff"/>
  <circle cx="287" cy="212" r="3" fill="#ffffff"/>
  
  <!-- Subtle Smile -->
  <path d="M 248,232 Q 256,238 264,232" fill="none" stroke="#0a1d30" stroke-width="3" stroke-linecap="round"/>

  <!-- PWS Monogram at Bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PWS</text>
</svg>
